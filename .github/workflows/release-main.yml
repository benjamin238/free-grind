name: Release Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create-release.outputs.release_id }}
      tag_name: ${{ steps.vars.outputs.tag_name }}
      release_name: ${{ steps.vars.outputs.release_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive release metadata
        id: vars
        run: |
          echo "package_version=$(jq -r '.version' package.json)" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tag_name=main-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "release_name=Open Grind v$(jq -r '.version' package.json) (${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"

      - name: Gather commits since last release
        id: commits
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Find the tag of the most recent published release
          PREV_TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" --no-merges | head -100)
          else
            LOG=$(git log --pretty=format:"- %s (%h)" --no-merges | head -100)
          fi
          # Write to a file to avoid quoting issues with multiline env vars
          printf '%s' "$LOG" > /tmp/commit_log.txt
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Generate AI release description
        id: ai_description
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          COMMITS=$(cat /tmp/commit_log.txt)
          if [ -z "$COMMITS" ]; then
            echo "No commits found; using fallback description."
            printf 'Automated release generated from a push to `main`.' > /tmp/release_body.txt
          else
            PAYLOAD=$(jq -n \
              --arg commits "$COMMITS" \
              '{
                model: "gpt-4o-mini",
                messages: [
                  {
                    role: "system",
                    content: "You are a helpful assistant that writes concise, user-friendly release notes for a desktop/mobile productivity app called Open Grind. Summarise the changes in plain English, grouped by theme where possible. Use markdown bullet points. Do not include a title heading."
                  },
                  {
                    role: "user",
                    content: ("Here are the commits since the last release:\n\n" + $commits + "\n\nWrite a release description.")
                  }
                ],
                max_tokens: 512
              }')
            RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer ${OPENAI_API_KEY}" \
              -d "$PAYLOAD")
            AI_BODY=$(echo "$RESPONSE" | jq -r '.choices[0].message.content // ""')
            if [ -z "$AI_BODY" ]; then
              printf 'Automated release generated from a push to `main`.' > /tmp/release_body.txt
            else
              printf '%s' "$AI_BODY" > /tmp/release_body.txt
            fi
          fi

      - name: Create draft release
        id: create-release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const aiBody = fs.readFileSync('/tmp/release_body.txt', 'utf8');
            const body = [
              aiBody,
              '',
              `Commit: ${context.sha}`
            ].join('\n');
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: '${{ steps.vars.outputs.tag_name }}',
              name: '${{ steps.vars.outputs.release_name }}',
              body,
              draft: true,
              prerelease: false,
              generate_release_notes: false
            });
            core.setOutput('release_id', String(data.id));

  build-desktop:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust_targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload desktop artifacts
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: bunx tauri
          args: ${{ matrix.args }}

  build-android:
    needs: create-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platform-tools" \
            "ndk;27.1.12297006"

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Restore Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p src-tauri/certs
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > src-tauri/certs/open-grind-dev.jks

      - name: Build Android APK
        run: bunx tauri android build --apk

      - name: Upload Android APK to release
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const apkPath = 'src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk';
            
            if (!fs.existsSync(apkPath)) {
              throw new Error(`APK not found at ${apkPath}`);
            }
            
            const fileData = fs.readFileSync(apkPath);
            
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.create-release.outputs.release_id }},
              name: 'app-universal-release.apk',
              data: fileData,
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': fileData.length
              }
            });
            
            console.log('✓ APK uploaded to release');


  publish-release:
    needs:
      - create-release
      - build-desktop
      - build-android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
              draft: false,
              prerelease: false
            });
